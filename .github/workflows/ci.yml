# Unified CI & Release workflow:
# - On PRs: runs checks, native host build, and builds the .tpk artifact without publishing a release.
# - On pushes to main / workflow_dispatch: runs checks, builds the .tpk once, publishes a GitHub Release
#   with the .tpk and installer scripts, and prunes older releases to keep only the latest 5.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (config, templates, scripts)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: VERSION is x.y.z
        run: |
          VERSION=$(head -n1 VERSION)
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error file=VERSION::'$VERSION' is not x.y.z"; exit 1; }

      # The app downloads remote-config.json from main at startup: a broken file breaks every installed TV.
      - name: JSON files are valid
        run: |
          for f in $(git ls-files '*.json'); do
            python3 -c "import json, sys; json.load(open(sys.argv[1]))" "$f" || { echo "::error file=$f::invalid JSON"; exit 1; }
          done

      - name: Issue templates and workflows are valid YAML
        run: |
          for f in $(git ls-files '.github/*.yml' '.github/**/*.yml'); do
            python3 -c "import yaml, sys; yaml.safe_load(open(sys.argv[1]))" "$f" || { echo "::error file=$f::invalid YAML"; exit 1; }
          done

      # The in-app report screen pre-fills bug.yml through URL parameters (app/ForgeTube/BugReport.cs).
      - name: Bug report fields match BugReport.cs
        run: |
          python3 - <<'EOF'
          import re, sys, yaml
          ids = {f.get("id") for f in yaml.safe_load(open(".github/ISSUE_TEMPLATE/bug.yml"))["body"]}
          params = set(re.findall(r'"&(\w+)="', open("app/ForgeTube/BugReport.cs").read())) - {"title"}
          missing = sorted(params - ids)
          if missing:
              print(f"::error file=.github/ISSUE_TEMPLATE/bug.yml::BugReport.cs fills fields missing from bug.yml: {missing}")
              sys.exit(1)
          print("ok:", sorted(params))
          EOF

      - name: Shell scripts parse
        run: |
          for f in scripts/*.sh; do bash -n "$f"; done
          shellcheck -S error scripts/*.sh

  core-host:
    name: Core + PC tools (native build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Fetch third-party sources
        run: scripts/fetch-deps.sh

      - name: Build
        run: |
          cmake -S core -B build/host -DOMEGA_HOST_TOOLS=ON -DCMAKE_BUILD_TYPE=Release -Wno-dev
          cmake --build build/host -j"$(nproc)"

  tpk:
    name: TV package (.tpk) & Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install Tizen workload
        run: curl -sSL https://raw.githubusercontent.com/Samsung/Tizen.NET/main/workload/scripts/workload-install.sh | bash

      - name: Fetch third-party sources
        run: scripts/fetch-deps.sh

      - name: Build core (TV toolchain) + app
        run: OMEGA_NO_SIGN=1 scripts/build-app.sh

      # Unsigned for any TV (SDK test signature): re-sign it with your own profile before installing.
      - uses: actions/upload-artifact@v7
        with:
          name: forgetube-${{ github.event.pull_request.number && format('pr{0}', github.event.pull_request.number) || github.sha }}
          path: app/ForgeTube/bin/Release/net8.0-tizen10.0/**/*.tpk
          retention-days: 14

      # Stable names: install.sh downloads them from releases/latest/download/.
      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          VERSION=$(head -n1 VERSION)
          COMMIT_ID=$(git rev-parse --short HEAD)
          TPK=$(find app/ForgeTube/bin/Release -name '*.tpk' | head -n1)
          cp "$TPK" dist/forgetube.tpk
          cp "$TPK" "dist/forgetube-${VERSION}-${COMMIT_ID}.tpk"
          cp scripts/install-tv.sh dist/install.sh
          cp scripts/install-tv.ps1 dist/install.ps1
          cp tools/samsung-cert/SamsungCert.java dist/

          RELEASE_ID="v${VERSION}-${COMMIT_ID}"
          RELEASE_NAME="${VERSION} (${COMMIT_ID})"
          COMMIT_MSG=$(git log -1 --pretty=format:"- %s (%h)")
          gh release create "$RELEASE_ID" dist/* \
            --title "$RELEASE_NAME" \
            --target "$GITHUB_SHA" \
            --notes "$COMMIT_MSG" \
            || gh release upload "$RELEASE_ID" dist/* --clobber

      - name: Prune older releases (keep latest 5)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OLD_RELEASES=$(gh release list --limit 100 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[5:] | .[].tagName')
          for rel in $OLD_RELEASES; do
            echo "Deleting old release: $rel"
            gh release delete "$rel" --yes --cleanup-tag || true
          done
